<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junk Recovery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="animated-bg"></div>

    <div class="page-background">
        <div class="main-container">
            <div class="glass-header">

            </div>

            <div class="top-controls-container">

                <button id="emptyTrashBtn" style="color:var(--neon-red); background:none; border:none; cursor:pointer;">EMPTY ALL</button>
            </div>

            <div class="attendance-list" id="junkTable"></div>
        </div>
    </div>
    <script type="module" src="junk-logic.js"></script>
</body>
</html>
