<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Portal | Archive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="animated-bg"></div>

    <div class="page-background">
        <div class="main-container">
            <div class="glass-header">
                <h1 class="portal-title gold-text">SCAN ARCHIVE</h1>
                <div class="status-indicator gold-border">ARCHIVE MODE</div>
            </div>

            <div class="top-controls-container">
                <div class="nav-group">
                    <button id="navToPortal" class="action-btn"><i class="fa-solid fa-arrow-left"></i></button>
                </div>
                <div class="admin-group">
                    <i class="fa-solid fa-eraser action-btn" id="toggleDeleteMode"></i>
                </div>
            </div>

            <div class="attendance-list" id="historyTable"></div>
        </div>
    </div>

    <div id="historyModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modalStudentName" style="color:var(--neon-gold)">NAME</h2>
            <div id="individualLogs" class="attendance-list" style="max-height: 300px;"></div>
            <button id="closeModal" class="action-btn" style="width:100%; margin-top:15px; color:var(--neon-red)">CLOSE</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
