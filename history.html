<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Portal | Archive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="animated-bg"></div>
    <div class="particles" id="particles"></div>

    <div class="page-background">
        <div class="main-container">
            <!-- Header -->
            <div class="glass-header archive-header">
                <h1 class="portal-title gold-text">SCAN ARCHIVE</h1>
                <div class="archive-badge">
                    <i class="fa-solid fa-folder-tree"></i>
                    <span>ALPHABETICAL VIEW</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="top-controls-container">
                <div class="nav-group">
                    <button id="navToPortal" class="action-btn back-btn">
                        <i class="fa-solid fa-arrow-left"></i> Back to Live
                    </button>
                </div>
                
                <div class="admin-controls">
                    <div class="search-mini">
                        <input type="text" id="archiveSearch" placeholder="Find folder..." class="search-input-sm">
                        <i class="fa-solid fa-search"></i>
                    </div>
                    <button id="toggleDeleteMode" class="action-btn toggle-btn" title="Toggle Delete Mode">
                        <i class="fa-solid fa-eraser"></i>
                    </button>
                </div>
            </div>

            <!-- Alphabet Index -->
            <div class="alphabet-index" id="alphabetIndex">
                <!-- Generated by JS -->
            </div>

            <!-- Student Folders -->
            <div class="attendance-list folder-grid" id="historyTable">
                <div class="empty-state">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p>Loading archive...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="historyModal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <div class="student-avatar">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>
                <div class="student-info">
                    <h2 id="modalStudentName" class="student-name">Student Name</h2>
                    <span id="modalStudentGrade" class="student-grade">Grade --</span>
                </div>
                <button id="closeModal" class="close-btn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="modal-stats">
                <div class="stat-box">
                    <span class="stat-number" id="totalScans">0</span>
                    <span class="stat-label">Total Scans</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="lastScan">--</span>
                    <span class="stat-label">Last Scan</span>
                </div>
            </div>

            <div class="logs-container">
                <h3 class="logs-title"><i class="fa-solid fa-clock-rotate-left"></i> Scan History</h3>
                <div id="individualLogs" class="logs-list"></div>
            </div>
            
            <button id="closeModalBottom" class="action-btn close-modal-btn">
                <i class="fa-solid fa-check"></i> Done
            </button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
